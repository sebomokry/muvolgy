<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Könyvfesztivál programtábla</title>
<meta name="description" content="A 31. Budapesti Nemzetközi Könyvfesztivál programjai idő × helyszín táblában.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* "paper & press ink" palette, loosely derived from the printed programme:
     cream page, warm black ink (#231f20), programme red deepened for contrast,
     orange + periwinkle for the two entry kinds. Categorical sets validated
     (lightness band, chroma floor, CVD/normal-vision separation, contrast). */
  --paper:#fbf7f1; --ink:#231f20; --accent:#b8323a; --accent-soft:#f6e4e2;
  --danger:#7a1f2b; --danger-soft:#f6e3e0;
  --pin:#e9a21f; --saved:#b8323a; --now:#e03a2f; --divider:#bbc4e4;
  --prog:#4b5bd0; --sign:#ee8a2c;
  --soft:rgba(35,31,32,.05); --soft2:rgba(35,31,32,.1); --muted:rgba(35,31,32,.68); --faint:rgba(35,31,32,.4);
  --display:"Space Grotesk",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --px:2; --lane:60px; --venue-w:104px; --head-h:36px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-variant-numeric:tabular-nums;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 16px 8px}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:2px;background:var(--soft);border-radius:999px;padding:4px;flex-shrink:0}
.seg button{white-space:nowrap;border-radius:999px;padding:4px 14px;font-family:var(--display);font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.filters{display:flex;flex-direction:column;gap:8px;padding:4px 16px 12px;max-height:60vh;overflow-y:auto;flex-shrink:0}
.days{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.days button{flex-shrink:0;border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:14px;color:var(--muted)}
.days button:hover{background:var(--soft);color:var(--ink)}
.days button.on{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;background:var(--soft);color:var(--muted);transition:background .15s,color .15s}
.chip:hover{background:var(--soft2);color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--c);color:#fff}
.chip.on .dot{background:#fff}
.chip.toggle{font-family:var(--mono)}
.chip.toggle.on{background:var(--ink);color:var(--paper)}
.chip:not(.on) .dot{box-shadow:0 0 0 1px rgba(35,31,32,.08)}
@media (max-width:639px),(max-height:499px){ .more.closed{display:none} }
@media (min-width:640px) and (min-height:500px){ .chip.toggle{display:none} }
.main{flex:1;min-height:0}
/* grid */
.gs{height:100%;overflow:auto;display:flex;flex-direction:column}
.gs>*{flex-shrink:0;width:max-content}
.ghead{position:sticky;top:0;z-index:20;display:flex;height:var(--head-h);background:rgba(251,247,241,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.corner{position:sticky;left:0;z-index:10;width:var(--venue-w);display:flex;align-items:center;justify-content:center;background:var(--paper)}
.info-btn{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:14px;display:flex;align-items:center;justify-content:center}
.axis{position:relative}
.hour{position:absolute;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hour.first{transform:translateY(-50%)}
.hour.last{transform:translate(-100%,-50%)}
.row{display:flex;border-radius:12px;transition:box-shadow .2s}
.vcell{position:sticky;left:0;z-index:10;width:var(--venue-w);padding:3px 6px 3px 8px;background:var(--paper);display:flex}
.vcard{flex:1;min-width:0;border-radius:12px;border-top:3px solid var(--cs);background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;font-family:var(--display);font-weight:700;font-size:11.5px;line-height:1.15;overflow:hidden;hyphens:manual;-webkit-hyphens:manual;overflow-wrap:anywhere}
.vcard .vn{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.vcard .pin{font-size:11px;line-height:1;margin-bottom:2px}
.tl{position:relative;overflow:hidden}
.blk{position:absolute;overflow:hidden;border-radius:8px;border-left:3px solid var(--c);background:var(--bg);padding:4px 6px;text-align:left;font-size:9px;line-height:1.25;transition:box-shadow .15s}
.blk:hover{box-shadow:0 4px 12px rgba(35,31,32,.12)}
.blk.sel{box-shadow:0 0 0 2px var(--accent)}
.blk.conf{box-shadow:0 0 0 2px var(--danger);background:repeating-linear-gradient(135deg,var(--bg) 0 6px,var(--danger-soft) 6px 9px)}
.blk .h{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .sub{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.blk .tm{margin-top:2px;font-family:var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(35,31,32,.1);pointer-events:none}
.nowl{position:absolute;top:0;bottom:0;width:2px;border-radius:2px;background:var(--now);pointer-events:none}
.divider{padding:8px}
.divider div{height:4px;border-radius:999px;background:var(--divider)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
/* lists */
.list{height:100%;overflow-y:auto}
.list-in{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.dayh{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:24px 0 8px}
.dayh:first-child{margin-top:4px}
.item{display:flex;width:100%;align-items:flex-start;justify-content:space-between;gap:12px;text-align:left;border-radius:16px;padding:12px 14px;background:rgba(35,31,32,.03);margin-bottom:6px;transition:background .15s}
.item:hover{background:rgba(35,31,32,.06)}
.item.conf{background:var(--danger-soft)}
.item .meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.item.conf .meta{color:var(--danger)}
.item .t{font-weight:600;margin-top:2px}
.item .o{font-size:13px;color:var(--muted);margin-top:2px}
.item .kdot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:4px}
.note{border-radius:16px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.note.bad{background:var(--danger-soft);color:var(--danger);font-weight:500}
.note.info{background:var(--soft)}
.search{width:100%;border-radius:14px;border:1px solid transparent;background:var(--soft);padding:11px 14px;font-size:15px;outline:none}
.search:focus{background:#fff;border-color:rgba(184,50,58,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 16px;font-family:var(--display);font-size:14px;font-weight:500;transition:opacity .15s,background .15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:var(--soft)}
.btn.ghost:hover{background:var(--soft2)}
.btn.remove{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.foot{margin-top:40px;text-align:center;font-size:12px;color:var(--muted)}
.foot a{color:inherit}
/* modal */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(35,31,32,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.md{position:relative;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;border-radius:24px;background:var(--paper);padding:24px;box-shadow:0 25px 50px -12px rgba(35,31,32,.3),0 0 0 1px rgba(35,31,32,.05)}
.md h2{margin:0 32px 0 0;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.25}
.md .x{position:absolute;top:18px;right:20px;font-family:var(--mono);color:var(--faint);font-size:16px}
.md .x:hover{color:var(--ink)}
.md .when{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:8px}
.md .venue{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--display);font-weight:500}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:500;color:#fff;background:var(--c)}
.pill.soft{background:var(--soft);color:var(--ink)}
.md .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.md .desc{font-size:14px;line-height:1.55;margin-top:14px;white-space:pre-line}
.md .org{font-size:13px;color:var(--muted);font-style:italic;margin-top:10px}
.md .rel{margin-top:18px;border-radius:16px;background:rgba(35,31,32,.03);padding:12px}
.md .rel p{margin:0 0 6px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
.md .rel button{display:block;width:100%;text-align:left;padding:6px 0;border-top:1px solid rgba(35,31,32,.05)}
.md .rel button:first-of-type{border-top:0}
.md .rel .m{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.md .rel .n{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md p.txt{font-size:14px;line-height:1.55;color:var(--ink)}
.demo-badge{display:inline-block;border-radius:999px;background:var(--pin);color:var(--ink);font-size:10.5px;font-weight:600;padding:1px 8px;margin-left:6px;vertical-align:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;font-size:14px;box-shadow:0 10px 25px rgba(35,31,32,.25)}
@media (max-width:639px){
  :root{--venue-w:98px}
  .seg{width:100%}
  .seg button{flex:1}
  .days .okt{display:none}
  .days button{padding:6px 12px}
  .vcard{font-size:10.5px}
  .seg button{padding:4px 9px;font-size:13px}
  .seg{padding:2px}
  .brand h1{font-size:17px}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="modal-root"></div>
<script>
const DATA = /*DATA*/;
const DAYS = [1,2,3,4].map(d => ({ d, date:`2026-10-0${d}`, label:`okt. ${d}.`, wd:["csütörtök","péntek","szombat","vasárnap"][d-1], ini:["Cs","P","Sz","V"][d-1] }));
const ZONES = {
  hall:  { name:"Termek, pódiumok", c:"#ec8479", cs:"#f7c3bc" },
  guest: { name:"Díszvendégországok", c:"#8e9bea", cs:"#cdd3f6" },
  kids:  { name:"Gyerek & képregény", c:"#e9a21f", cs:"#f6d693" },
  dedik: { name:"Dedikálópontok", c:"#cb86c6", cs:"#e8c6e5" },
  stand: { name:"Kiadói standok", c:"#6fbd7c", cs:"#bfe2c4" },
};
// shorter labels for the narrow sticky venue column (full name stays in tooltip + modal)
const SHORT = {
  "Díszvendégországok programterme":"Díszvendég programterem",
  "Díszvendégországok standja":"Díszvendég stand",
  "Plenáris terem előtt – Panorama Lounge":"Panorama Lounge",
};
const ZONE_ORDER = ["hall","guest","kids","dedik","stand"];
const TAGS = { // fixed validated order: adjacent chips stay distinguishable
  kids:   { name:"Gyerekeknek", c:"#a86207" },
  guest:  { name:"Díszvendég: DE · AT · CH", c:"#a3408f" },
  irish:  { name:"Ír fókusz", c:"#237d4b" },
  interp: { name:"Tolmácsolással", c:"#2f6fd0" },
  comics: { name:"Képregény", c:"#d2452c" },
};
const KINDS = { p:{ name:"Programok", c:"var(--prog)", hex:"#4b5bd0" }, s:{ name:"Dedikálások", c:"var(--sign)", hex:"#ee8a2c" } };
const SIGN_MIN = 60; // signings list only a start time

// ---- data prep
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const P = DATA.programs.map(p => {
  const s = toMin(p.s); const e = p.e ? toMin(p.e) : s + SIGN_MIN;
  return { ...p, sm:s, em:e <= s ? e + 1440 : e, endKnown: !!p.e };
});
const byId = new Map(P.map(p => [p.id, p]));
const fmt = m => `${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const timeText = p => p.endKnown ? `${fmt(p.sm)}–${fmt(p.em)}` : `${fmt(p.sm)}-tól`;
const dayOf = d => DAYS[d-1];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
P.forEach(p => { p.hay = fold([p.t,p.ds,p.o,p.v,p.sr].join(" ")); });

// ---- persistence
const LS = "bnkf26-favs";
function loadFavs(){ try { return new Set(JSON.parse(localStorage.getItem(LS) || "[]").filter(id => byId.has(id))); } catch { return new Set(); } }
function saveFavs(){ try { localStorage.setItem(LS, JSON.stringify([...S.favs])); } catch {} }

function budapestNow(){
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Budapest",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x => [x.type,x.value]));
  return { date:`${parts.year}-${parts.month}-${parts.day}`, min:Number(parts.hour)*60+Number(parts.minute) };
}
const today = DAYS.find(x => x.date === budapestNow().date);

// ---- state
const S = {
  view:"grid", day: today ? today.d : 2,
  kinds:new Set(["p","s"]), zones:new Set(ZONE_ORDER), tags:new Set(),
  onlyFav:false, moreOpen:false, q:"", favs:loadFavs(), open:null, info:false, incoming:null,
};
{ // shared favorites via URL hash: #kedvencek=1,2,3
  const m = location.hash.match(/kedvencek=([\d,]+)/);
  if (m) { const ids = m[1].split(",").map(Number).filter(id => byId.has(id)); if (ids.length) S.incoming = ids; }
}

// ---- derived
function conflicts(){
  const favs = [...S.favs].map(id => byId.get(id));
  const out = new Set();
  for (let i=0;i<favs.length;i++) for (let j=i+1;j<favs.length;j++){
    const a=favs[i], b=favs[j];
    if (a.d===b.d && a.sm<b.em && b.sm<a.em){ out.add(a.id); out.add(b.id); }
  }
  return out;
}
function visible(p){
  if (S.onlyFav) return S.favs.has(p.id);
  if (S.favs.has(p.id)) return true; // saved picks always stay on the grid
  if (!S.kinds.has(p.k)) return false;
  if (!S.zones.has(DATA.venues[p.v])) return false;
  if (S.tags.size && !p.tg.some(t => S.tags.has(t))) return false;
  return true;
}
function lanes(list){
  const sorted=[...list].sort((a,b)=>a.sm-b.sm||a.em-b.em), active=[], out=[]; let n=0;
  for (const p of sorted){
    for (let i=active.length-1;i>=0;i--) if (active[i].em<=p.sm) active.splice(i,1);
    const used=new Set(active.map(a=>a.lane)); let lane=0; while(used.has(lane)) lane++;
    active.push({em:p.em,lane}); n=Math.max(n,lane+1); out.push({p,lane});
  }
  return {items:out,n:Math.max(n,1)};
}
const natural = new Intl.Collator("hu",{numeric:true});

// ---- render
const app = document.getElementById("app");
function render(){
  const conf = conflicts();
  const favCount = S.favs.size;
  app.innerHTML = `
    <header class="top">
      <div class="brand"><h1>Könyvfesztivál 2026</h1><small>programtábla</small></div>
      <nav class="seg">
        ${[["grid","Programtábla"],["mine",`Kedvenceim${favCount?` (${favCount})`:""}`],["search","Kereső"]].map(([k,l])=>`<button data-view="${k}" class="${S.view===k?"on":""}">${l}</button>`).join("")}
      </nav>
    </header>
    ${S.view==="grid" ? filtersHtml() : ""}
    <div class="main">${S.view==="grid" ? gridHtml(conf) : S.view==="mine" ? mineHtml(conf) : searchHtml()}</div>`;
  renderModal();
  if (S.view==="search"){ const i=document.getElementById("q"); if(i && document.activeElement!==i && S.focusSearch){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); S.focusSearch=false; } }
}
function chip(attrs, label, color, on){ return `<button class="chip ${on?"on":""}" style="--c:${color}" ${attrs}><span class="dot"></span>${esc(label)}</button>`; }
function filtersHtml(){
  const activeFilters = (ZONE_ORDER.length - S.zones.size) + S.tags.size;
  return `<div class="filters">
    <div class="days">${DAYS.map(x=>`<button data-day="${x.d}" class="${S.day===x.d?"on":""}"><span class="okt">okt. </span>${x.d}. ${x.ini}</button>`).join("")}</div>
    <div class="chips">
      ${Object.entries(KINDS).map(([k,v])=>chip(`data-kind="${k}"`, v.name, v.hex, S.kinds.has(k))).join("")}
      ${chip(`data-onlyfav`, "Csak a kedvenceim", "var(--saved)", S.onlyFav)}
      <button class="chip toggle ${S.moreOpen?"on":""}" data-more>${S.moreOpen?"▾":"▸"} Szűrők${activeFilters?` (${activeFilters})`:""}</button>
    </div>
    <div class="chips more ${S.moreOpen?"":"closed"}" style="${S.onlyFav?"opacity:.4":""}">
      ${ZONE_ORDER.map(z=>chip(`data-zone="${z}"`, ZONES[z].name, ZONES[z].c, S.zones.has(z))).join("")}
    </div>
    <div class="chips more ${S.moreOpen?"":"closed"}" style="${S.onlyFav?"opacity:.4":""}">
      ${Object.entries(TAGS).map(([k,v])=>chip(`data-tag="${k}"`, v.name, v.c, S.tags.has(k))).join("")}
    </div>
  </div>`;
}
function gridHtml(conf){
  const list = P.filter(p => p.d===S.day && visible(p));
  if (!list.length) return `<div class="empty">Nincs megjeleníthető program ezen a napon a kiválasztott szűrőkkel.</div>`;
  const byV = new Map();
  list.forEach(p => { if(!byV.has(p.v)) byV.set(p.v,[]); byV.get(p.v).push(p); });
  const pinned = v => byV.get(v).some(p => S.favs.has(p.id));
  const venues = [...byV.keys()].sort((a,b) =>
    (pinned(b)-pinned(a)) || (ZONE_ORDER.indexOf(DATA.venues[a]) - ZONE_ORDER.indexOf(DATA.venues[b])) || natural.compare(a,b));
  const start = Math.floor(Math.min(...list.map(p=>p.sm))/60)*60;
  const end = Math.ceil(Math.max(...list.map(p=>p.em))/60)*60;
  const px = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--px")) || 2;
  const laneH = 60, gap = 3, inset = 2;
  const W = (end-start)*px;
  const hours = []; for (let m=start;m<=end;m+=60) hours.push(m);
  const now = budapestNow();
  const showNow = now.date===dayOf(S.day).date && now.min>=start && now.min<=end;
  const nowX = (now.min-start)*px;
  const gridlines = hours.map(m=>`<div class="gl" style="left:${(m-start)*px}px"></div>`).join("") + (showNow?`<div class="nowl" style="left:${nowX}px"></div>`:"");
  let html = `<div class="gs" id="gs"><div class="ghead"><div class="corner"><button class="info-btn" data-info aria-label="Az oldalról">ⓘ</button></div>
    <div class="axis" style="width:${W}px">${hours.map((m,i)=>`<div class="hour ${i===0?"first":i===hours.length-1?"last":""}" style="left:${(m-start)*px}px">${fmt(m)}</div>`).join("")}${showNow?`<div class="nowl" style="left:${nowX}px"></div>`:""}</div></div>`;
  let prevPinned = true;
  for (const v of venues){
    const isPinned = pinned(v);
    if (prevPinned && !isPinned && venues.some(pinned)) html += `<div class="divider" style="width:calc(var(--venue-w) + ${W}px)"><div></div></div>`;
    prevPinned = isPinned;
    const z = ZONES[DATA.venues[v]];
    const {items,n} = lanes(byV.get(v));
    const h = n*laneH + 2*gap;
    html += `<div class="row"><div class="vcell" style="height:${h}px;padding-top:${gap}px;padding-bottom:${gap}px"><div class="vcard" style="--c:${z.c};--cs:${z.cs}" title="${esc(v)}"><span class="vn">${isPinned?"★ ":""}${esc(SHORT[v] ?? v).replace(/Díszvendégországok/g,"Díszvendég\u00ADországok").replace(/Olvasószalon/g,"Olvasó\u00ADszalon").replace(/programterem/g,"program\u00ADterem").replace(/dedikálópont/g,"dedikáló\u00ADpont").replace(/Képregényzóna/g,"Képregény\u00ADzóna")}</span></div></div>
      <div class="tl" style="width:${W}px;height:${h}px">`;
    for (const {p,lane} of items){
      const k = KINDS[p.k];
      const x = (p.sm-start)*px + inset/2, w = Math.max(6,(p.em-p.sm)*px - inset);
      const cls = conf.has(p.id) ? "conf" : S.favs.has(p.id) ? "sel" : "";
      const sub = p.k==="s" ? p.o : (p.o || p.sr || "");
      html += `<button class="blk ${cls}" data-open="${p.id}" title="${esc(p.t)}" style="left:${x}px;width:${w}px;top:${gap+lane*laneH+inset/2}px;height:${laneH-inset}px;--c:${k.hex};--bg:${k.hex}40">
        <div class="h">${cls==="conf"?"⚠ ":""}${esc(p.t)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}<div class="tm">${timeText(p)}</div></button>`;
    }
    html += gridlines + `</div></div>`;
  }
  return html + `</div>`;
}
function progItem(p, conf){
  const c = conf && conf.has(p.id);
  return `<button class="item ${c?"conf":""}" data-open="${p.id}"><div style="min-width:0">
    <div class="meta">${c?"⚠ ":""}${dayOf(p.d).label} ${dayOf(p.d).ini} · ${timeText(p)} · ${esc(p.v)}</div>
    <div class="t">${esc(p.t)}</div>${p.o?`<div class="o">${esc(p.o)}</div>`:""}</div>
    <span class="kdot" style="background:${KINDS[p.k].hex}" title="${KINDS[p.k].name}"></span></button>`;
}
function mineHtml(conf){
  const favs = [...S.favs].map(id=>byId.get(id)).sort((a,b)=>a.d-b.d||a.sm-b.sm);
  let body = "";
  if (!favs.length){
    body = `<div class="note info">Még nincs kiválasztott program. A Programtáblán vagy a Keresőben kattints egy programra, és add hozzá a kedvenceidhez. A kiválasztott programok ütközését az oldal automatikusan jelzi.</div>`;
  } else {
    const nConf = favs.filter(p=>conf.has(p.id)).length;
    body += `<div class="row-btns"><button class="btn ghost" data-share>🔗 Kedvenceim megosztása linkkel</button></div>`;
    if (nConf) body += `<div class="note bad">${nConf} kiválasztott program időben ütközik egy másikkal.</div>`;
    let lastDay = null;
    for (const p of favs){
      if (p.d!==lastDay){ body += `<div class="dayh">${dayOf(p.d).label} (${dayOf(p.d).wd})</div>`; lastDay=p.d; }
      body += progItem(p, conf);
    }
  }
  return `<div class="list"><div class="list-in">${body}${footHtml()}</div></div>`;
}
function searchHtml(){
  const q = fold(S.q.trim());
  const words = q.split(/\s+/).filter(Boolean);
  let body;
  if (!words.length){
    body = `<p class="o" style="color:var(--muted);font-size:14px">Keress szerzőre, könyvcímre, kiadóra vagy helyszínre, például <i>„Spiró”</i>, <i>„Magvető”</i>, <i>„C40”</i> vagy <i>„képregény”</i>.</p>`;
  } else {
    const res = P.filter(p => words.every(w => p.hay.includes(w))).sort((a,b)=>a.d-b.d||a.sm-b.sm);
    body = `<p style="font-size:13px;color:var(--muted)">${res.length} találat</p>` + res.slice(0,150).map(p=>progItem(p,null)).join("") + (res.length>150?`<p style="font-size:13px;color:var(--muted)">…és még ${res.length-150}. Pontosíts a keresésen.</p>`:"");
  }
  return `<div class="list"><div class="list-in"><input id="q" class="search" type="search" placeholder="Keresés a teljes programban…" value="${esc(S.q)}" autocomplete="off"><div style="margin-top:14px">${body}</div>${footHtml()}</div></div>`;
}
function footHtml(){ return `<div class="foot"><button class="btn ghost" data-info style="padding:6px 12px;font-size:12px">ⓘ Az oldalról</button></div>`; }

// ---- modal
const mroot = document.getElementById("modal-root");
function renderModal(){
  if (S.incoming){
    mroot.innerHTML = `<div class="ov" data-close-incoming><div class="md" data-stop>
      <h2>Megosztott kedvencek</h2>
      <p class="txt">Valaki megosztott veled <b>${S.incoming.length} programot</b>. Hozzáadod őket a saját kedvenceidhez?</p>
      <div class="row-btns"><button class="btn ghost" data-close-incoming style="flex:1">Mégse</button><button class="btn primary" data-accept-incoming style="flex:1">Hozzáadás</button></div></div></div>`;
    return;
  }
  if (S.info){
    mroot.innerHTML = `<div class="ov" data-close><div class="md" data-stop><button class="x" data-close aria-label="Bezárás">✕</button>
      <h2>Mi ez az oldal?</h2>
      <p class="txt">Ez egy <b>nem hivatalos bemutató változat</b>, amely a 31. Budapesti Nemzetközi Könyvfesztivál (2026. október 1–4.) letölthető programfüzetét dolgozza fel egy könnyen böngészhető, telefonra optimalizált programtáblává.</p>
      <p class="txt">A táblán <b>idő × helyszín</b> szerint látszik minden program, így első ránézésre kiderül, mi zajlik egyszerre. Szűrhetsz típusra (programok, dedikálások), helyszíncsoportra és témára, kereshetsz szerzőre, kiadóra, standra, és a programokra kattintva összeállíthatod a saját kedvenc listádat. A kedvenceid közti időbeli ütközéseket az oldal jelzi, a listát pedig linkkel meg is oszthatod.</p>
      <p class="txt" style="color:var(--muted);font-size:13px">A kedvenceid csak ebben a böngészőben tárolódnak, regisztráció nélkül.</p>
    </div></div>`;
    return;
  }
  const p = S.open && byId.get(S.open);
  if (!p){ mroot.innerHTML=""; return; }
  const z = ZONES[DATA.venues[p.v]], fav = S.favs.has(p.id);
  const rel = p.o ? P.filter(x => x.id!==p.id && x.o===p.o).sort((a,b)=>a.d-b.d||a.sm-b.sm) : [];
  mroot.innerHTML = `<div class="ov" data-close><div class="md" data-stop><button class="x" data-close aria-label="Bezárás">✕</button>
    ${p.sr?`<div style="margin-bottom:6px"><span class="pill" style="--c:#a3408f">${esc(p.sr)}</span></div>`:""}
    <h2>${p.k==="s"?"Dedikál: ":""}${esc(p.t)}</h2>
    <div class="when">${dayOf(p.d).label} (${dayOf(p.d).wd}) · ${timeText(p)}</div>
    <div class="venue">${esc(p.v)} <span class="pill" style="--c:${z.c}">${z.name}</span></div>
    ${p.tg.length?`<div class="tags">${p.tg.map(t=>`<span class="pill" style="--c:${TAGS[t].c}">${TAGS[t].name}</span>`).join("")}</div>`:""}
    ${p.ds?`<div class="desc">${esc(p.ds)}</div>`:""}
    ${p.o?`<div class="org">(${esc(p.o)})</div>`:""}
    <button class="btn block ${fav?"remove":"primary"}" data-fav="${p.id}" style="margin-top:18px">${fav?"★ Eltávolítás a kedvenceim közül":"☆ Hozzáadás a kedvenceimhez"}</button>
    ${rel.length?`<div class="rel"><p>${p.o.includes(",")?"A szervezők":"A kiadó / szervező"} további programjai (${rel.length})</p>${rel.slice(0,30).map(r=>`<button data-open="${r.id}"><div class="m">${dayOf(r.d).label} · ${fmt(r.sm)} · ${esc(r.v)}${r.k==="s"?" · dedikálás":""}</div><div class="n">${esc(r.t)}</div></button>`).join("")}</div>`:""}
  </div></div>`;
}

// ---- events
let toastTimer;
function toast(msg){
  clearTimeout(toastTimer);
  let el = document.querySelector(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; document.body.appendChild(el); }
  el.textContent = msg; toastTimer = setTimeout(()=>el.remove(), 2200);
}
function toggleSet(set, v){ set.has(v) ? set.delete(v) : set.add(v); }
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-close],[data-close-incoming],[data-stop]");
  if (!t) return;
  const d = t.dataset;
  if ("stop" in d && !t.matches("button")) return;
  if (d.view){ S.view=d.view; if(d.view==="search") S.focusSearch=true; render(); return; }
  if (d.day){ S.day=Number(d.day); render(); document.getElementById("gs")?.scrollTo(0,0); return; }
  if (d.kind){ toggleSet(S.kinds,d.kind); render(); return; }
  if (d.zone){ toggleSet(S.zones,d.zone); render(); return; }
  if (d.tag){ toggleSet(S.tags,d.tag); render(); return; }
  if ("onlyfav" in d){ S.onlyFav=!S.onlyFav; if(S.onlyFav) S.moreOpen=false; render(); return; }
  if ("more" in d){ S.moreOpen=!S.moreOpen; render(); return; }
  if (d.open){ S.open=Number(d.open); renderModal(); document.querySelector(".md")?.scrollTo(0,0); return; }
  if (d.fav){ toggleSet(S.favs,Number(d.fav)); saveFavs(); render(); return; }
  if ("info" in d){ S.info=true; renderModal(); return; }
  if ("share" in d){
    const url = `${location.origin}${location.pathname}#kedvencek=${[...S.favs].join(",")}`;
    (navigator.clipboard?.writeText(url) ?? Promise.reject()).then(()=>toast("Link kimásolva – küldd el a barátaidnak!"), ()=>prompt("Másold ki ezt a linket:", url));
    return;
  }
  if ("acceptIncoming" in d){ S.incoming.forEach(id=>S.favs.add(id)); saveFavs(); S.incoming=null; history.replaceState(null,"",location.pathname+location.search); S.view="mine"; render(); toast("Hozzáadva a kedvenceidhez"); return; }
  if ("closeIncoming" in d && (t.matches("button") || e.target===t)){ S.incoming=null; history.replaceState(null,"",location.pathname+location.search); renderModal(); return; }
  if ("close" in d && (t.matches("button") || e.target===t)){ S.open=null; S.info=false; renderModal(); return; }
});
document.addEventListener("input", e => { if (e.target.id==="q"){ S.q=e.target.value; const pos=e.target.selectionStart; render(); const i=document.getElementById("q"); i.focus(); i.setSelectionRange(pos,pos); } });
document.addEventListener("keydown", e => { if (e.key==="Escape" && (S.open||S.info)){ S.open=null; S.info=false; renderModal(); } });
setInterval(() => { if (S.view==="grid" && !S.open && !S.info){ const gs=document.getElementById("gs"); const x=gs?.scrollLeft, y=gs?.scrollTop; render(); const g=document.getElementById("gs"); if(g){ g.scrollLeft=x; g.scrollTop=y; } } }, 60000);
try { if (!localStorage.getItem("bnkf26-seen")) { S.info = !S.incoming; localStorage.setItem("bnkf26-seen","1"); } } catch {}
render();
</script>
</body>
</html>
